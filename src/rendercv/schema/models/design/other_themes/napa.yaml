# yaml-language-server: $schema=../../../../../../schema.json
design:
  theme: napa
  page:
    size: us-letter
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.7in
    right_margin: 0.5in
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    footer: rgb(110, 110, 110)
    top_note: rgb(110, 110, 110)
  typography:
    line_spacing: 0.55em
    alignment: justified-with-no-hyphenation
    font_family:
      body: Open Sans
      name: Open Sans
      headline: Open Sans
      connections: Open Sans
      section_titles: Open Sans
    font_size:
      body: 10pt
      name: 20pt
      headline: 10pt
      connections: 9pt
      section_titles: 1.05em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  header:
    alignment: left
    space_below_name: 0.25cm
    space_below_headline: 0.2cm
    space_below_connections: 0.35cm
    connections:
      separator: "|"
      show_icons: false
      display_urls_instead_of_usernames: true
      space_between_connections: 0.35cm
  links:
    underline: true
    show_external_link_icon: false
  section_titles:
    type: with_full_line
    line_thickness: 0.35pt
    space_above: 0.35cm
    space_below: 0.18cm
  sections:
    space_between_regular_entries: 0.7em
    space_between_text_based_entries: 0.15em
    show_time_spans_in: []
  entries:
    short_second_row: false
    side_space: 0cm
    space_between_columns: 0.15cm
    date_and_location_width: 3.35cm
    summary:
      space_above: 0.03cm
    highlights:
      bullet: "•"
      nested_bullet: "◦"
      space_left: 0cm
      space_above: 0.03cm
      space_between_items: 0.03cm
      space_between_bullet_and_text: 0.35em
  templates:
    education_entry:
      main_column: "**INSTITUTION**, DEGREE_WITH_AREA -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
      degree_column: null
    normal_entry:
      main_column: "**NAME** -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    experience_entry:
      main_column: "**POSITION**, COMPANY -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
